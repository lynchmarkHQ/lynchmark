name: Run Single Test Benchmark

on:
  workflow_dispatch:
    inputs:
      test_number:
        description: 'Test number to run (e.g. 4)'
        required: true
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run benchmark for single test
        run: npm start -- --test "${{ inputs.test_number }}"
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README tests
          git diff --staged --quiet || (git commit -m "Docs: Update benchmark for test ${{ inputs.test_number }}" && git pull --rebase && git push)
